apiVersion: v1
kind: Service
metadata:
  name: events-api
spec:
  selector:
    app: events-api
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: events-api
  template:
    metadata:
      labels:
        app: events-api
    spec:
      containers:
      - name: events-api
        image: hopdinhp02/ticketsales-eventsapi:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__Database
          value: "Host=postgres-shared;Port=5432;Database=event_db;Username=user;Password=password"
        - name: MessageBroker__Host
          value: "rabbitmq"
        - name: Authentication__Authority
          value: "http://identity-api:8080" 
        - name: ConnectionStrings__Redis
          value: "redis:6379"
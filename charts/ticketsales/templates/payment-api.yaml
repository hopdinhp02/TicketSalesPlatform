apiVersion: v1
kind: Service
metadata:
  name: payment-api
spec:
  selector:
    app: payment-api
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api-deployment
spec:
  replicas: {{ .Values.paymentsApi.replicas }}
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: payment-api
        image: "{{ .Values.paymentsApi.image.repository }}:{{ .Values.paymentsApi.image.tag }}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__Database
          value: "Host=postgres-shared;Port=5432;Database=payment_db;Username=user;Password=password"
        - name: Authentication__Authority
          value: "http://identity-api:8080"
        - name: MessageBroker__Host
          value: "rabbitmq"
        - name: Services__OrderApiUrl
          value: "http://orders-api:8080"
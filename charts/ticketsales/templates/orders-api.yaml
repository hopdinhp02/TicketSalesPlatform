apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector:
    app: orders-api
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api-deployment
spec:
  replicas: {{ .Values.ordersApi.replicas }}
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
      - name: orders-api
        image: "{{ .Values.ordersApi.image.repository }}:{{ .Values.ordersApi.image.tag }}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__Database
          value: "Host=postgres-shared;Port=5432;Database=order_db;Username=user;Password=password"
        - name: Authentication__Authority
          value: "http://identity-api:8080"
        - name: MessageBroker__Host
          value: "rabbitmq"
        - name: Services__EventsApiUrl
          value: "http://events-api:8080"
        - name: Services__InventoryApiUrl
          value: "http://inventory-api:8080"